[package]
name = "radarvector-feed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
hex = "0.4.3"
minisign-verify = "0.3.0"
radarvector-data = { version = "0.1.0", path = "../radarvector-data" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
minisign = "0.10.0"
tempfile = "3.27.0"
